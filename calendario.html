<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bellievie · Calendário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="calendario.css">
</head>

<body>
    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <strong>BELLIEVIE</strong>
                <span>REPRESENTANTE</span>
            </div>
            <nav class="menu" id="menu">
                <a href="dashboarda.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 2.5h11v11h-11zM2.5 8h11M8 2.5v11"/></svg> Dashboard
                </a>
                <a href="eventos.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 2.5h11v11h-11zM2.5 6h11M2.5 9.5h11"/></svg> Eventos
                </a>
                <a href="relatorio.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11zM8 3.5v9"/></svg> Relatórios
                </a>
                <a href="calendario.html" class="active gap" aria-current="page">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg> Calendário
                </a>
                <a href="viagem.html" class="">
                    <svg width="20" height="20" viewBox="0 0 24 24" class="fill"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg> Viagens
                </a>
                <a href="visitas.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg> visitas
                </a>
                <hr>
            </nav>
            <div class="profile">
                <div class="photo">
                    <svg width="36" height="36" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#8d9a94"/><circle cx="16" cy="12.5" r="5.5" fill="#1b2b24"/><path d="M5.5 27c1.5-6 5.5-8 10.5-8s9 2 10.5 8c-3 3-6.5 4.5-10.5 4.5S8.5 30 5.5 27z" fill="#1b2b24"/></svg>
                </div>
                <div>
                    <b>Representante</b>
                    <small>Usuário corporativo</small>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO -->
        <main class="main">

            <div class="title">
                <h1>Calendário</h1>
            </div>
            <div class="content">
                <div class="head">
                    <div class="nav"><button id="prev" aria-label="Mês anterior">‹</button>
                        <h2 id="titulo"></h2><button id="next" aria-label="Próximo mês">›</button></div>
                    <button class="view" type="button">Mês</button>
                </div>
                <p id="mensagemCalendario" class="calendar-message" role="status" aria-live="polite">Carregando calendário...</p>
                <div class="cal" id="cal"></div>
            </div>
        </main>
    </div>
    <script>
        const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        let eventosCalendario = [];
        let ref = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

        function escaparHTML(valor) {
            return String(valor ?? "").replace(/[&<>"']/g, (caractere) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            })[caractere]);
        }

        function render() {
            const y = ref.getFullYear();
            const m = ref.getMonth();
            document.getElementById('titulo').textContent = MESES[m] + ' ' + y;
            const primeiro = new Date(y, m, 1).getDay();
            const semanas = Math.ceil((primeiro + new Date(y, m + 1, 0).getDate()) / 7);
            const cal = document.getElementById('cal');
            cal.style.gridTemplateRows = '42px repeat(' + semanas + ', minmax(95px, 1fr))';
            const inicio = new Date(y, m, 1 - primeiro);
            const hoje = new Date();
            let html = DOW.map((dia) => '<div class="dow">' + dia + '</div>').join('');

            for (let i = 0; i < semanas * 7; i++) {
                const data = new Date(inicio);
                data.setDate(inicio.getDate() + i);
                const fora = data.getMonth() !== m;
                const chave = `${data.getFullYear()}-${String(data.getMonth() + 1).padStart(2, '0')}-${String(data.getDate()).padStart(2, '0')}`;
                const itens = fora ? [] : eventosCalendario.filter((item) => String(item.data).slice(0, 10) === chave);
                const classes = itens.map((item) => {
                    const tipo = item.tipo === 'visita' ? 'visita' : item.tipo === 'viagem' ? 'viagem' : 'evento';
                    const status = ['reprovado', 'recusada'].includes(item.status) ? ' recusado' : '';
                    const horario = item.horario ? ` · ${escaparHTML(item.horario)}` : '';
                    return `<div class="ev ${tipo}${status}" title="${escaparHTML(item.titulo)}">${escaparHTML(item.titulo)}${horario}</div>`;
                }).join('');
                html += '<div class="cell' + (fora ? ' out' : '') + (data.toDateString() === hoje.toDateString() ? ' hoje' : '') + '"><span>' + data.getDate() + '</span>' + classes + '</div>';
            }
            cal.innerHTML = html;
        }

        async function carregarCalendario() {
            const mensagem = document.getElementById('mensagemCalendario');
            mensagem.textContent = 'Consultando eventos, visitas e viagens...';
            try {
                const resposta = await fetch('/api/calendario', {
                    credentials: 'same-origin',
                    headers: { Accept: 'application/json' },
                });
                const dados = await resposta.json();
                if (resposta.status === 401) {
                    mensagem.textContent = dados.erro || 'Sua sessão expirou. Entre novamente no sistema.';
                    return;
                }
                if (!resposta.ok) throw new Error(dados.erro || 'Não foi possível carregar o calendário.');
                eventosCalendario = Array.isArray(dados) ? dados : [];
                mensagem.textContent = `${eventosCalendario.length} compromisso(s) encontrado(s).`;
                render();
            } catch (erro) {
                mensagem.textContent = erro.message;
                render();
            }
        }

        document.getElementById('prev').addEventListener('click', () => {
            ref.setMonth(ref.getMonth() - 1);
            render();
        });
        document.getElementById('next').addEventListener('click', () => {
            ref.setMonth(ref.getMonth() + 1);
            render();
        });

        render();
        carregarCalendario();
    </script>
</body>

</html>
